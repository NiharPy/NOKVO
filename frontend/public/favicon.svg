<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="NOKVO">
  <title>NOKVO</title>
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>
  <style>
    .mark{fill:url(#n)}
    @media (prefers-color-scheme:dark){.mark{fill:#fafafa}}
  </style>
  <!-- Two forward-leaning shards split by a diagonal gap — the NOKVO mark. -->
  <path class="mark" d="M12 26 L34 26 L56 74 L34 74 Z"/>
  <path class="mark" d="M38 26 L60 26 L82 74 L60 74 Z"/>
</svg>
